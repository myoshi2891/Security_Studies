name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Types / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-docs
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run types:check

      - name: Test
        run: bun test --coverage

      - name: Upload coverage to Codecov
        # カバレッジ送信は品質ゲートではないため、Codecov 側の障害（TLS 拒否等）で CI を落とさない
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: security-docs/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-docs
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 高・重大レベルの脆弱性のみで CI を失敗させる（moderate/low はレポートのみで通過）。
      # 対処方針:
      #   1. ローカルで `bun audit` を実行し、CVE / 影響パッケージ / 推奨バージョンを確認
      #   2. 直接依存: `bun update <package>` または `bun add <package>@<safe-version>` で修正
      #      推移依存: `bun update` でロックファイル再解決、不可なら package.json の overrides で固定
      #   3. パッチ未提供時は CVE ID を `bun audit --ignore=<CVE-ID>` で一時除外し、
      #      docs/progress.md の「セキュリティ / CSP」セクションに対応期限とともに記録する
      #   4. `bun audit` が利用不能な環境では `npm audit --audit-level=high` に切り替える
      - name: Run security audit
        # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3): パッチ未提供・dev 依存のみ（eslint-config-next 経由）。
        # 見直し期限: 2026-11-05（docs/progress.md 参照）
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      # 本番依存のみを除外指定なしで監査し、一時除外が本番依存に波及していないことを保証する
      - name: Run production dependency audit
        run: bun audit --prod --audit-level=high