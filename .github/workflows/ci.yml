name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  quality:
    name: Lint / Types / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run types:check

      - name: Test
        run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@bf67ee1d8825c34537330756778f6734d8ef091a # v4.5.0
        with:
          files: security-docs/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
