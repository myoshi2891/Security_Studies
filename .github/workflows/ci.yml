name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Types / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run types:check

      - name: Test
        run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: security-docs/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 高・重大レベルの脆弱性のみで CI を失敗させる（moderate/low はレポートのみで通過）。
      # 対処方針:
      #   1. ローカルで `bun audit` を実行し、CVE / 影響パッケージ / 推奨バージョンを確認
      #   2. 直接依存: `bun update <package>` または `bun add <package>@<safe-version>` で修正
      #      推移依存: `bun update` でロックファイル再解決、不可なら package.json の overrides で固定
      #   3. パッチ未提供時は CVE ID を `bun audit --ignore=<CVE-ID>` で一時除外し、
      #      docs/progress.md の「セキュリティ / CSP」セクションに対応期限とともに記録する
      #   4. `bun audit` が利用不能な環境では `npm audit --audit-level=high` に切り替える
      - name: Run security audit
        run: bun audit --audit-level=high